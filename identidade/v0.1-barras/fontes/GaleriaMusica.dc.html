<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Croma — Galeria de música</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#A3A3A0;text-decoration:none}
.mono{font-family:'IBM Plex Mono',monospace}
.linha{display:grid;grid-template-columns:repeat(7,216px);justify-content:space-between}
.tile{width:216px;display:flex;flex-direction:column;gap:10px}
.quad{width:216px;height:216px;box-sizing:border-box;position:relative;display:flex;background:#17181A}
.quad > i{flex:1 1 0;display:block;background-size:cover;background-position:center}
.t1{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-family:'IBM Plex Mono',monospace;font-size:14px;color:#A3A3A0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{margin:0;font-size:28px;font-weight:700;font-stretch:112%}
.cab{display:flex;justify-content:space-between;align-items:baseline}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; overflow: hidden; background: #0B0B0C; color: #F2F2F0; font-family: 'Archivo', system-ui, sans-serif; padding: 44px 96px 0; display: flex; flex-direction: column; gap: 32px">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 72px">
      <div style="display: flex; align-items: center; gap: 2px; font-size: 32px; font-weight: 800; font-stretch: 125%">
        <span>CR</span>
        <svg role="img" aria-label="Croma" width="40" height="24" viewBox="0 0 172 102" style="margin: 0 3px"><rect x="6" y="6" width="160" height="90" fill="none" stroke="#F2F2F0" stroke-width="14"/><rect x="12" y="72" width="21.6" height="18" fill="#C0C0C0"/><rect x="33.4" y="72" width="21.6" height="18" fill="#C0C000"/><rect x="54.9" y="72" width="21.6" height="18" fill="#00C0C0"/><rect x="76.3" y="72" width="21.6" height="18" fill="#00C000"/><rect x="97.7" y="72" width="21.6" height="18" fill="#C000C0"/><rect x="119.1" y="72" width="21.6" height="18" fill="#C00000"/><rect x="140.6" y="72" width="19.4" height="18" fill="#0000C0"/></svg>
        <span>MA</span>
      </div>
      <nav aria-label="Seções" style="display: flex; gap: 36px">
        <sc-for list="{{nav}}" as="item" hint-placeholder-count="7">
          <a href="#" style="display: flex; flex-direction: column; gap: 8px; font-size: 22px; font-weight: 600; color: {{item.fg}}">
            <span>{{item.label}}</span>
            <span style="height: {{item.h}}; background: {{item.bar}}"></span>
          </a>
        </sc-for>
      </nav>
    </div>
    <div style="display: flex; align-items: center; gap: 20px">
      <button type="button" aria-label="Buscar" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: #17181A; border: 0; color: #F2F2F0">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      </button>
      <button type="button" aria-label="Perfil" style="width: 56px; height: 56px; background: #2A2B2E; border: 0; color: #F2F2F0; font-family: 'Archivo', sans-serif; font-size: 22px; font-weight: 700">D</button>
    </div>
  </div>

  <div style="display: flex; align-items: flex-end; justify-content: space-between; flex-shrink: 0">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div class="mono" style="display: flex; align-items: center; gap: 12px; font-size: 16px; letter-spacing: 0.14em; color: #C8E4C8">
        <span style="width: 16px; height: 16px; background: #00C000"></span>
        <span>λ 530 nm · 11 ÁLBUNS · 9 ARTISTAS · 7 PLAYLISTS</span>
      </div>
      <h1 style="margin: 0; font-size: 64px; font-weight: 800; font-stretch: 125%; line-height: 1">Música</h1>
    </div>
    <div style="display: flex; gap: 12px; align-items: center">
      <sc-for list="{{chips}}" as="ch">
        <span style="font-size: 20px; font-weight: 600; padding: 12px 22px; background: {{ch.bg}}; color: {{ch.fg}}">{{ch.label}}</span>
      </sc-for>
    </div>
  </div>

  <!-- Álbuns -->
  <div style="display: flex; flex-direction: column; gap: 18px; flex-shrink: 0">
    <div class="cab"><h2>Adicionados recentemente</h2><span class="mono" style="font-size: 16px; color: #A3A3A0">Todos os álbuns · 11 ›</span></div>
    <div class="linha">
      <sc-for list="{{albuns}}" as="a" hint-placeholder-count="7">
        <div class="tile">
          <div class="quad" style="outline: {{a.outline}}"><i style="background-image: url('{{a.img}}')"></i></div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span class="t1" style="color: {{a.fg}}">{{a.t}}</span>
            <span class="t2">{{a.s}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- Artistas -->
  <div style="display: flex; flex-direction: column; gap: 18px; flex-shrink: 0">
    <div class="cab"><h2>Artistas</h2><span class="mono" style="font-size: 16px; color: #A3A3A0">sem foto, a capa do artista é montada com os álbuns dele</span></div>
    <div class="linha">
      <sc-for list="{{artistas}}" as="r" hint-placeholder-count="7">
        <div class="tile">
          <div class="quad" style="gap: {{r.gap}}; background: {{r.bg}}">
            <sc-for list="{{r.imgs}}" as="im"><i style="background-image: url('{{im}}')"></i></sc-for>
            <span class="mono" style="position: absolute; left: 0; bottom: 0; padding: 4px 8px; background: #0B0B0C; font-size: 12px; letter-spacing: 0.1em; color: {{r.tagFg}}">{{r.tag}}</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span class="t1">{{r.nome}}</span>
            <span class="t2">{{r.info}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- Playlists (continua abaixo da dobra) -->
  <div style="display: flex; flex-direction: column; gap: 18px; flex-shrink: 0">
    <div class="cab"><h2>Playlists Croma</h2></div>
    <div class="linha">
      <sc-for list="{{playlists}}" as="pl">
        <div class="tile"><div class="quad"><sc-for list="{{pl}}" as="b"><i style="background: {{b}}"></i></sc-for></div></div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var navItems = [['Início', '#F2F2F0'], ['Filmes', '#C0C000'], ['Séries', '#00C0C0'], ['Música', '#00C000'], ['Fotos', '#C000C0'], ['TV ao vivo', '#C00000'], ['Livros', '#0000C0']];
    var nav = navItems.map(function (n, i) {
      var on = i === 3;
      return { label: n[0], fg: on ? '#F2F2F0' : '#A3A3A0', bar: n[1], h: on ? '6px' : '2px' };
    });
    var chips = ['Tudo', 'Álbuns', 'Artistas', 'Playlists', 'Faixas'].map(function (l, i) {
      return { label: l, bg: i === 0 ? '#F2F2F0' : '#17181A', fg: i === 0 ? '#0B0B0C' : '#F2F2F0' };
    });
    var M = '../midia/musica/';
    var albuns = [
      ['Rumours', 'Fleetwood Mac · 1977', 'fleetwood-mac-rumours-1977'],
      ['21', 'Adele · 2011', 'adele-21-2011'],
      ['Hot Space', 'Queen · 1982', 'queen-hot-space-1982'],
      ['True', 'Avicii · 2013', 'avicii-true-2013'],
      ['18 Months', 'Calvin Harris · 2012', 'calvin-harris-18-months-2012'],
      ['Músicas para Churrasco, Vol. 1', 'Seu Jorge · 2011', 'seu-jorge-musicas-para-churrasco-vol-1-2011'],
      ['Queen II', 'Queen · 1974', 'queen-queen-ii-1974']
    ].map(function (a, i) {
      var on = i === 2;
      return { t: a[0], s: a[1], img: M + a[2] + '.jpg', outline: on ? '8px solid #F2F2F0' : '0 solid transparent', fg: on ? '#F2F2F0' : '#E4E4E1' };
    });
    /* Artista com foto: a foto. Sem foto: as capas dos álbuns dele lado a lado (até 2). */
    function art(nome, info, imgs, foto) {
      return { nome: nome, info: info, imgs: imgs.map(function (n) { return M + n + '.jpg'; }), gap: imgs.length > 1 ? '4px' : '0', bg: imgs.length > 1 ? '#F2F2F0' : '#17181A', tag: foto ? 'FOTO' : (imgs.length > 1 ? 'MOSAICO' : 'CAPA'), tagFg: foto ? '#00C000' : '#A3A3A0' };
    }
    var artistas = [
      art('Coldplay', 'só faixas soltas', ['coldplay'], true),
      art('Queen', '2 álbuns', ['queen-queen-ii-1974', 'queen-hot-space-1982']),
      art('Calvin Harris', '1 álbum · 1 single', ['calvin-harris-18-months-2012', 'calvin-harris-my-way-2016']),
      art('Avicii', '1 álbum · 1 single', ['avicii-true-2013', 'avicii-levels-2011']),
      art('Pink Floyd', '1 álbum', ['pink-floyd-the-dark-side-of-the-moon-1973']),
      art('Daft Punk', '1 álbum', ['daft-punk-random-access-memories-2013']),
      art('Adele', '1 álbum', ['adele-21-2011'])
    ];
    function lambda(l) {
      var r = 0, g = 0, b = 0;
      if (l < 440) { r = -(l - 440) / 60; b = 1; }
      else if (l < 490) { g = (l - 440) / 50; b = 1; }
      else if (l < 510) { g = 1; b = -(l - 510) / 20; }
      else if (l < 580) { r = (l - 510) / 70; g = 1; }
      else if (l < 645) { r = 1; g = -(l - 645) / 65; }
      else { r = 1; }
      var f = l < 420 ? 0.3 + 0.7 * (l - 380) / 40 : 1;
      function c(v) { return ('0' + Math.round(191 * v * f).toString(16)).slice(-2); }
      return '#' + c(r) + c(g) + c(b);
    }
    function barras(de, ate) { var o = []; for (var i = 0; i < 7; i++) o.push(lambda(de + (ate - de) * i / 6)); return o; }
    var playlists = [barras(400, 700), barras(590, 700), barras(450, 495), barras(495, 570), barras(400, 450), barras(560, 610), barras(470, 540)];
    return { nav: nav, chips: chips, albuns: albuns, artistas: artistas, playlists: playlists };
  }
}
</script>
</body>
</html>
