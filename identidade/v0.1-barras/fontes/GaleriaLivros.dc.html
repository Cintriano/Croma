<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Croma — Galeria de livros</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#A3A3A0;text-decoration:none}
.mono{font-family:'IBM Plex Mono',monospace}
h2{margin:0;font-size:28px;font-weight:700;font-stretch:112%}
/* Capa gerada: regra oficial para qualquer item sem arte */
.capa{box-sizing:border-box;position:relative;background:#17181A;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.capa .ponto{display:block;background:#3B3BFF}
.capa .titulo{font-family:'Archivo',sans-serif;font-weight:800;font-stretch:125%;color:#F2F2F0;line-height:1.02}
.capa .autor{font-family:'IBM Plex Mono',monospace;color:#A3A3A0}
.capa .barras{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));flex-shrink:0}
.capa .barras i{display:block}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; overflow: hidden; background: #0B0B0C; color: #F2F2F0; font-family: 'Archivo', system-ui, sans-serif; padding: 44px 96px 0; display: flex; flex-direction: column; gap: 32px">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 72px">
      <div style="display: flex; align-items: center; gap: 2px; font-size: 32px; font-weight: 800; font-stretch: 125%">
        <span>CR</span>
        <svg role="img" aria-label="Croma" width="40" height="24" viewBox="0 0 172 102" style="margin: 0 3px"><rect x="6" y="6" width="160" height="90" fill="none" stroke="#F2F2F0" stroke-width="14"/><rect x="12" y="72" width="21.6" height="18" fill="#C0C0C0"/><rect x="33.4" y="72" width="21.6" height="18" fill="#C0C000"/><rect x="54.9" y="72" width="21.6" height="18" fill="#00C0C0"/><rect x="76.3" y="72" width="21.6" height="18" fill="#00C000"/><rect x="97.7" y="72" width="21.6" height="18" fill="#C000C0"/><rect x="119.1" y="72" width="21.6" height="18" fill="#C00000"/><rect x="140.6" y="72" width="19.4" height="18" fill="#0000C0"/></svg>
        <span>MA</span>
      </div>
      <nav aria-label="Seções" style="display: flex; gap: 36px">
        <sc-for list="{{nav}}" as="item" hint-placeholder-count="7">
          <a href="#" style="display: flex; flex-direction: column; gap: 8px; font-size: 22px; font-weight: 600; color: {{item.fg}}">
            <span>{{item.label}}</span>
            <span style="height: {{item.h}}; background: {{item.bar}}"></span>
          </a>
        </sc-for>
      </nav>
    </div>
    <div style="display: flex; align-items: center; gap: 20px">
      <button type="button" aria-label="Buscar" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: #17181A; border: 0; color: #F2F2F0">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      </button>
      <button type="button" aria-label="Perfil" style="width: 56px; height: 56px; background: #2A2B2E; border: 0; color: #F2F2F0; font-family: 'Archivo', sans-serif; font-size: 22px; font-weight: 700">D</button>
    </div>
  </div>

  <div style="display: flex; align-items: flex-end; justify-content: space-between; flex-shrink: 0">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div class="mono" style="display: flex; align-items: center; gap: 12px; font-size: 16px; letter-spacing: 0.14em; color: #C8C8F2">
        <span style="width: 16px; height: 16px; background: #3B3BFF"></span>
        <span>λ 460 nm · 64 LIVROS · 3 EM LEITURA</span>
      </div>
      <h1 style="margin: 0; font-size: 64px; font-weight: 800; font-stretch: 125%; line-height: 1">Livros</h1>
    </div>
    <div style="display: flex; gap: 12px; align-items: center">
      <sc-for list="{{chips}}" as="ch">
        <span style="font-size: 20px; font-weight: 600; padding: 12px 22px; background: {{ch.bg}}; color: {{ch.fg}}">{{ch.label}}</span>
      </sc-for>
    </div>
  </div>

  <!-- Continuar lendo -->
  <div style="display: flex; flex-direction: column; gap: 18px; flex-shrink: 0">
    <h2>Continuar lendo</h2>
    <div style="display: flex; gap: 32px">
      <sc-for list="{{lendo}}" as="l" hint-placeholder-count="3">
        <div style="width: 554px; height: 180px; box-sizing: border-box; background: #111214; display: flex; gap: 24px; outline: {{l.outline}}">
          <div class="capa" style="width: 120px; height: 180px; flex-shrink: 0; padding: 10px 10px 0">
            <span class="ponto" style="width: 10px; height: 10px"></span>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <span class="titulo" style="font-size: 14px">{{l.t}}</span>
              <div class="barras" style="height: 11px; margin: 0 -10px"><i style="background:#C0C0C0"></i><i style="background:#C0C000"></i><i style="background:#00C0C0"></i><i style="background:#00C000"></i><i style="background:#C000C0"></i><i style="background:#C00000"></i><i style="background:#0000C0"></i></div>
            </div>
          </div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding-right: 24px">
            <span style="font-size: 24px; font-weight: 700">{{l.t}}</span>
            <span class="mono" style="font-size: 15px; color: #A3A3A0">{{l.a}}</span>
            <div style="height: 6px; background: #2A2B2E; display: flex; margin-top: 10px"><div style="width: {{l.pct}}; background: #3B3BFF"></div></div>
            <span class="mono" style="font-size: 14px; color: {{l.capFg}}">{{l.cap}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- Todos os livros: grade 2:3 com capas geradas -->
  <div style="display: flex; flex-direction: column; gap: 18px; flex-shrink: 0">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2>Todos os livros</h2>
      <span class="mono" style="font-size: 15px; color: #A3A3A0">Sem capa no arquivo, o Croma gera uma: ponto da biblioteca, título, autor e a faixa de barras · Ordenar: ano ▾</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, 216px); justify-content: space-between">
      <sc-for list="{{livros}}" as="b" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; gap: 10px">
          <div class="capa" style="width: 216px; height: 324px; padding: 16px 16px 0; outline: {{b.outline}}">
            <div style="display: flex; justify-content: space-between">
              <span class="ponto" style="width: 16px; height: 16px"></span>
              <span style="display: {{b.lido}}; width: 26px; height: 26px; background: #3B3BFF; align-items: center; justify-content: center"><svg aria-label="Lido" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#F2F2F0" stroke-width="2.6" stroke-linecap="square"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px">
              <span class="titulo" style="font-size: 24px">{{b.t}}</span>
              <span class="autor" style="font-size: 13px">{{b.a}}</span>
              <div class="barras" style="height: 20px; margin: 6px -16px 0"><i style="background:#C0C0C0"></i><i style="background:#C0C000"></i><i style="background:#00C0C0"></i><i style="background:#00C000"></i><i style="background:#C000C0"></i><i style="background:#C00000"></i><i style="background:#0000C0"></i></div>
            </div>
          </div>
          <div class="mono" style="display: flex; justify-content: space-between; font-size: 14px; color: {{b.capFg}}">
            <span>{{b.ano}}</span><span>{{b.fmt}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var navItems = [['Início', '#F2F2F0'], ['Filmes', '#C0C000'], ['Séries', '#00C0C0'], ['Música', '#00C000'], ['Fotos', '#C000C0'], ['TV ao vivo', '#C00000'], ['Livros', '#3B3BFF']];
    var nav = navItems.map(function (n, i) {
      var on = i === 6;
      return { label: n[0], fg: on ? '#F2F2F0' : '#A3A3A0', bar: n[1], h: on ? '6px' : '2px' };
    });
    var chips = ['Todos', 'Lendo', 'Não lidos', 'Lidos', 'Autores ▾', 'A–Z'].map(function (l, i) {
      return { label: l, bg: i === 0 ? '#F2F2F0' : '#17181A', fg: i === 0 ? '#0B0B0C' : '#F2F2F0' };
    });
    var lendo = [
      ['Dom Casmurro', 'Machado de Assis · 1899 · EPUB', 'cap. 1 de 148 · 1%', 1],
      ['O Cortiço', 'Aluísio Azevedo · 1890 · EPUB', 'cap. 9 de 23 · 39%', 39],
      ['Memórias Póstumas de Brás Cubas', 'Machado de Assis · 1881 · PDF', 'cap. 71 de 160 · 44%', 44]
    ].map(function (l, i) {
      var on = i === 0;
      return { t: l[0], a: l[1], cap: l[2], pct: l[3] + '%', outline: on ? '8px solid #F2F2F0' : '0 solid transparent', capFg: on ? '#F2F2F0' : '#A3A3A0' };
    });
    var livros = [
      ['A Moreninha', 'Joaquim Manuel de Macedo', '1844', 'EPUB', false],
      ['O Guarani', 'José de Alencar', '1857', 'EPUB', false],
      ['Iracema', 'José de Alencar', '1865', 'EPUB', true],
      ['Senhora', 'José de Alencar', '1875', 'PDF', true],
      ['O Alienista', 'Machado de Assis', '1882', 'EPUB', false],
      ['Quincas Borba', 'Machado de Assis', '1891', 'EPUB', false],
      ['Triste Fim de Policarpo Quaresma', 'Lima Barreto', '1915', 'PDF', false]
    ].map(function (b) {
      return { t: b[0], a: b[1], ano: b[2], fmt: b[3], lido: b[4] ? 'flex' : 'none', outline: '0 solid transparent', capFg: '#8A8B8E' };
    });
    return { nav: nav, chips: chips, lendo: lendo, livros: livros };
  }
}
</script>
</body>
</html>
