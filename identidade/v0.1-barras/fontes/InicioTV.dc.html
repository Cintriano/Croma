<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Croma — Início na TV</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#A3A3A0;text-decoration:none}a:hover{color:#F2F2F0}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; overflow: hidden; background: #0B0B0C; color: #F2F2F0; font-family: 'Archivo', system-ui, sans-serif; padding: 44px 96px 0; display: flex; flex-direction: column; gap: 40px">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 64px">
    <div style="display: flex; align-items: center; gap: 72px">
      <div style="display: flex; align-items: center; gap: 2px; font-size: 32px; font-weight: 800; font-stretch: 125%">
        <span>CR</span>
        <svg role="img" aria-label="Croma" width="40" height="24" viewBox="0 0 172 102" style="margin: 0 3px">
          <rect x="6" y="6" width="160" height="90" fill="none" stroke="#F2F2F0" stroke-width="14"></rect>
          <rect x="12" y="72" width="21.6" height="18" fill="#C0C0C0"></rect>
          <rect x="33.4" y="72" width="21.6" height="18" fill="#C0C000"></rect>
          <rect x="54.9" y="72" width="21.6" height="18" fill="#00C0C0"></rect>
          <rect x="76.3" y="72" width="21.6" height="18" fill="#00C000"></rect>
          <rect x="97.7" y="72" width="21.6" height="18" fill="#C000C0"></rect>
          <rect x="119.1" y="72" width="21.6" height="18" fill="#C00000"></rect>
          <rect x="140.6" y="72" width="19.4" height="18" fill="#0000C0"></rect>
        </svg>
        <span>MA</span>
      </div>
      <nav aria-label="Seções" style="display: flex; gap: 36px">
        <sc-for list="{{nav}}" as="item" hint-placeholder-count="7">
          <a href="#" style="display: flex; flex-direction: column; gap: 8px; font-size: 22px; font-weight: 600; color: {{item.fg}}">
            <span>{{item.label}}</span>
            <span style="height: 4px; background: {{item.bar}}"></span>
          </a>
        </sc-for>
      </nav>
    </div>
    <div style="display: flex; align-items: center; gap: 20px">
      <button type="button" aria-label="Buscar" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: #17181A; border: 0; color: #F2F2F0; cursor: pointer">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      </button>
      <button type="button" aria-label="Perfil" style="width: 56px; height: 56px; background: #2A2B2E; border: 0; color: #F2F2F0; font-family: 'Archivo', sans-serif; font-size: 22px; font-weight: 700; cursor: pointer">D</button>
    </div>
  </div>

  <div style="display: flex; gap: 64px; align-items: center">
    <div style="width: 880px; height: 495px; flex-shrink: 0; box-sizing: border-box; border: 12px solid #F2F2F0; background: #17181A url('../midia/filmes/duna-2021-h.jpg') center / cover; display: flex; flex-direction: column">
      <div style="flex-grow: 1"></div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); height: 10px">
        <div style="background: #C0C0C0"></div>
        <div style="background: #C0C000"></div>
        <div style="background: #00C0C0"></div>
        <div style="background: #00C000"></div>
        <div style="background: #C000C0"></div>
        <div style="background: #C00000"></div>
        <div style="background: #0000C0"></div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 22px; min-width: 0">
      <div style="display: flex; align-items: center; gap: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 16px; letter-spacing: 0.14em; color: #E4E4C8">
        <span style="width: 16px; height: 16px; background: #C0C000"></span>
        <span>FILME · EM DESTAQUE</span>
      </div>
      <h1 style="margin: 0; font-size: 64px; font-weight: 800; font-stretch: 125%; line-height: 1.02">Duna</h1>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: #A3A3A0">2021 · 2h 35 · 2160p · HDR10 · Atmos</span>
      <p style="margin: 0; font-size: 22px; line-height: 1.5; color: #E4E4E1; max-width: 680px">Paul Atreides chega a Arrakis, o planeta deserto que guarda a substância mais valiosa do universo, e vê a própria família virar alvo.</p>
      <div style="display: flex; gap: 16px; padding-top: 10px">
        <button type="button" style="font-family: 'Archivo', sans-serif; font-size: 24px; font-weight: 700; padding: 16px 40px; background: #F2F2F0; color: #0B0B0C; border: 0; outline: 4px solid #F2F2F0; outline-offset: 4px; cursor: pointer">Assistir</button>
        <button type="button" style="font-family: 'Archivo', sans-serif; font-size: 24px; font-weight: 600; padding: 16px 36px; background: #17181A; color: #F2F2F0; border: 0; cursor: pointer">Detalhes</button>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 22px">
    <h2 style="margin: 0; font-size: 28px; font-weight: 700; font-stretch: 112%">Continuar</h2>
    <div style="display: flex; gap: 32px">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
        <div style="width: 352px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px">
          <div style="height: 198px; box-sizing: border-box; background: {{c.bg}}; border: {{c.border}}; display: flex; flex-direction: column; justify-content: space-between">
            <span style="align-self: center; margin-top: 74px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.1em; color: #A3A3A0">{{c.capa}}</span>
            <div style="height: 6px; background: #2A2B2E; display: flex">
              <div style="width: {{c.pct}}; background: {{c.color}}"></div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #A3A3A0">
            <span style="width: 10px; height: 10px; background: {{c.color}}"></span>
            <span>{{c.meta}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var navItems = [
      ['Início', '#F2F2F0'], ['Filmes', '#C0C000'], ['Séries', '#00C0C0'], ['Música', '#00C000'],
      ['Fotos', '#C000C0'], ['TV ao vivo', '#C00000'], ['Livros', '#0000C0']
    ];
    var nav = navItems.map(function (n, i) {
      return { label: n[0], fg: i === 0 ? '#F2F2F0' : '#A3A3A0', bar: n[1] };
    });
    var img = function (pasta, nome) { return "#17181A url('../midia/" + pasta + '/' + nome + "-h.jpg') center / cover"; };
    var cardData = [
      { meta: 'SÉRIE · DARK · T2 E06', color: '#00C0C0', pct: '42%', bg: img('series', 'dark-2017'), capa: '' },
      { meta: 'FILME · 1h 28 restante', color: '#C0C000', pct: '46%', bg: img('filmes', 'blade-runner-2049-2017'), capa: '' },
      { meta: 'LIVRO · cap. 14', color: '#3B3BFF', pct: '45%', bg: '#1B1C1F', capa: '[CAPA DO LIVRO]' },
      { meta: 'SÉRIE · RUPTURA · T2 E03', color: '#00C0C0', pct: '58%', bg: img('series', 'ruptura-2022'), capa: '' },
      { meta: 'SÉRIE · ARCANE · T2 E01', color: '#00C0C0', pct: '20%', bg: img('series', 'arcane-2021'), capa: '' }
    ];
    var cards = cardData.map(function (c, i) {
      return Object.assign({}, c, { border: i === 0 ? '8px solid #F2F2F0' : '0 solid transparent' });
    });
    return { nav: nav, cards: cards };
  }
}
</script>
</body>
</html>
