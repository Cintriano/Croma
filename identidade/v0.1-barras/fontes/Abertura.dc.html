<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Croma — Abertura</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.mono{font-family:'IBM Plex Mono',monospace}
:root{--t100:100ms;--t200:200ms;--t300:300ms;--t450:450ms;--t800:800ms;--enter:cubic-bezier(0.2,0,0,1)}
/* Sequência: moldura se desenha (450) → 7 barras sobem da esquerda para a direita (200 cada, a cada 100) → nome (300) → status (200) */
#simbolo .moldura{stroke-dasharray:100;stroke-dashoffset:100;animation:desenha var(--t450) var(--enter) both}
#simbolo .barra{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:sobe var(--t200) var(--enter) both}
#nome{opacity:0;transform:translateY(8px);animation:surge var(--t300) var(--enter) 1250ms both}
#status{opacity:0;animation:surge var(--t200) var(--enter) 1700ms both}
@keyframes desenha{to{stroke-dashoffset:0}}
@keyframes sobe{to{transform:scaleY(1)}}
@keyframes surge{to{opacity:1;transform:none}}
/* Sem movimento: estado final direto. ?estatico=1 faz o mesmo, para gerar a imagem. */
@media (prefers-reduced-motion: reduce){#simbolo .moldura,#simbolo .barra,#nome,#status{animation:none;stroke-dashoffset:0;transform:none;opacity:1}}
.estatico #simbolo .moldura,.estatico #simbolo .barra,.estatico #nome,.estatico #status{animation:none!important;stroke-dashoffset:0!important;transform:none!important;opacity:1!important}
.quadro{width:288px;display:flex;flex-direction:column;gap:12px}
.quadro .tela{height:162px;background:#0B0B0C;box-shadow:0 0 0 1px #2A2B2E;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.quadro span{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#A3A3A0;line-height:1.4}
.quadro b{color:#F2F2F0;font-weight:500}
</style>
</helmet>
<div id="raiz" style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0B0C; color: #F2F2F0; font-family: 'Archivo', system-ui, sans-serif">

  <!-- Tela de abertura (área útil acima da faixa de documentação) -->
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 740px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px">
    <svg id="simbolo" role="img" aria-label="Croma" width="360" height="214" viewBox="0 0 172 102">
      <rect class="barra" style="animation-delay: 450ms" x="12" y="72" width="21.6" height="18" fill="#C0C0C0"/>
      <rect class="barra" style="animation-delay: 550ms" x="33.4" y="72" width="21.6" height="18" fill="#C0C000"/>
      <rect class="barra" style="animation-delay: 650ms" x="54.9" y="72" width="21.6" height="18" fill="#00C0C0"/>
      <rect class="barra" style="animation-delay: 750ms" x="76.3" y="72" width="21.6" height="18" fill="#00C000"/>
      <rect class="barra" style="animation-delay: 850ms" x="97.7" y="72" width="21.6" height="18" fill="#C000C0"/>
      <rect class="barra" style="animation-delay: 950ms" x="119.1" y="72" width="21.6" height="18" fill="#C00000"/>
      <rect class="barra" style="animation-delay: 1050ms" x="140.6" y="72" width="19.4" height="18" fill="#0000C0"/>
      <path class="moldura" d="M86 6H166V96H6V6Z" pathLength="100" fill="none" stroke="#F2F2F0" stroke-width="12" stroke-linejoin="miter"/>
    </svg>
    <span id="nome" style="font-size: 56px; font-weight: 800; font-stretch: 125%; letter-spacing: 0.1em">CROMA</span>
    <span id="status" class="mono" style="font-size: 18px; color: #A3A3A0">Conectando a Casa · 192.168.0.10</span>
  </div>

  <!-- Documentação da sequência -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 340px; background: #111214; box-sizing: border-box; padding: 32px 96px 0; display: flex; flex-direction: column; gap: 22px">
    <div class="mono" style="display: flex; justify-content: space-between; font-size: 14px; letter-spacing: 0.12em; color: #A3A3A0">
      <span>SEQUÊNCIA DE ENTRADA · 1,9 s · ease-enter cubic-bezier(0.2, 0, 0, 1)</span>
      <span>SEM MOVIMENTO (prefers-reduced-motion): ESTADO FINAL DIRETO</span>
    </div>
    <div style="display: flex; justify-content: space-between">
      <sc-for list="{{quadros}}" as="q" hint-placeholder-count="5">
        <div class="quadro">
          <div class="tela">
            <svg aria-hidden="true" width="120" height="71" viewBox="0 0 172 102">
              <sc-for list="{{q.barras}}" as="b"><rect x="{{b.x}}" y="{{b.y}}" width="{{b.w}}" height="{{b.h}}" fill="{{b.cor}}"/></sc-for>
              <path d="M86 6H166V96H6V6Z" pathLength="100" fill="none" stroke="#F2F2F0" stroke-width="12" stroke-dasharray="100" stroke-dashoffset="{{q.offset}}" opacity="{{q.op}}"/>
            </svg>
            <span style="font-family: 'Archivo', sans-serif; font-size: 18px; font-weight: 800; font-stretch: 125%; letter-spacing: 0.1em; color: #F2F2F0; opacity: {{q.nome}}">CROMA</span>
          </div>
          <span><b>{{q.t}}</b> · {{q.d}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var xs = [12, 33.4, 54.9, 76.3, 97.7, 119.1, 140.6], ws = [21.6, 21.6, 21.6, 21.6, 21.6, 21.6, 19.4];
    var cores = ['#C0C0C0', '#C0C000', '#00C0C0', '#00C000', '#C000C0', '#C00000', '#0000C0'];
    /* n barras visíveis; a última pode estar pela metade (frac) */
    function barras(n, frac) {
      var out = [];
      for (var i = 0; i < n; i++) {
        var h = (i === n - 1 && frac) ? 18 * frac : 18;
        out.push({ x: xs[i], y: 90 - h, w: ws[i], h: h, cor: cores[i] });
      }
      return out;
    }
    var quadros = [
      { t: '0 ms', d: 'tela escura', barras: [], offset: 100, op: 0, nome: 0 },
      { t: '200 ms', d: 'a moldura se desenha', barras: [], offset: 55, op: 1, nome: 0 },
      { t: '450 ms', d: 'moldura completa', barras: [], offset: 0, op: 1, nome: 0 },
      { t: '800 ms', d: 'barras sobem, uma a uma', barras: barras(4, 0.5), offset: 0, op: 1, nome: 0 },
      { t: '1550 ms', d: 'nome e status', barras: barras(7), offset: 0, op: 1, nome: 1 }
    ];
    return { quadros: quadros };
  }
}
</script>
<script>
if (new URLSearchParams(location.search).get('estatico') === '1') {
  document.addEventListener('DOMContentLoaded', function () { document.getElementById('raiz').classList.add('estatico'); });
}
</script>
</body>
</html>
