<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Croma — Fotos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#A3A3A0;text-decoration:none}
.mono{font-family:'IBM Plex Mono',monospace}
.grupo{display:flex;flex-direction:column;gap:14px;flex-shrink:0}
.gcab{display:flex;justify-content:space-between;align-items:baseline;font-family:'IBM Plex Mono',monospace}
.fileira{display:flex;gap:12px}
.foto{position:relative;box-sizing:border-box;min-width:0}
.foto .rot{position:absolute;left:10px;bottom:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8A8B8E}
.foto .vid{position:absolute;right:8px;bottom:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:3px 7px;background:#0B0B0C;color:#F2F2F0}
.foto .fav{position:absolute;right:8px;top:8px;width:22px;height:22px;background:#C000C0;color:#F2F2F0;font-size:13px;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; overflow: hidden; background: #0B0B0C; color: #F2F2F0; font-family: 'Archivo', system-ui, sans-serif; padding: 44px 96px 0; display: flex; flex-direction: column; gap: 28px">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 72px">
      <div style="display: flex; align-items: center; gap: 2px; font-size: 32px; font-weight: 800; font-stretch: 125%">
        <span>CR</span>
        <svg role="img" aria-label="Croma" width="40" height="24" viewBox="0 0 172 102" style="margin: 0 3px"><rect x="6" y="6" width="160" height="90" fill="none" stroke="#F2F2F0" stroke-width="14"/><rect x="12" y="72" width="21.6" height="18" fill="#C0C0C0"/><rect x="33.4" y="72" width="21.6" height="18" fill="#C0C000"/><rect x="54.9" y="72" width="21.6" height="18" fill="#00C0C0"/><rect x="76.3" y="72" width="21.6" height="18" fill="#00C000"/><rect x="97.7" y="72" width="21.6" height="18" fill="#C000C0"/><rect x="119.1" y="72" width="21.6" height="18" fill="#C00000"/><rect x="140.6" y="72" width="19.4" height="18" fill="#0000C0"/></svg>
        <span>MA</span>
      </div>
      <nav aria-label="Seções" style="display: flex; gap: 36px">
        <sc-for list="{{nav}}" as="item" hint-placeholder-count="7">
          <a href="#" style="display: flex; flex-direction: column; gap: 8px; font-size: 22px; font-weight: 600; color: {{item.fg}}">
            <span>{{item.label}}</span>
            <span style="height: {{item.h}}; background: {{item.bar}}"></span>
          </a>
        </sc-for>
      </nav>
    </div>
    <div style="display: flex; align-items: center; gap: 20px">
      <button type="button" aria-label="Buscar" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: #17181A; border: 0; color: #F2F2F0">
        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      </button>
      <button type="button" aria-label="Perfil" style="width: 56px; height: 56px; background: #2A2B2E; border: 0; color: #F2F2F0; font-family: 'Archivo', sans-serif; font-size: 22px; font-weight: 700">D</button>
    </div>
  </div>

  <div style="display: flex; align-items: flex-end; justify-content: space-between; flex-shrink: 0">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div class="mono" style="display: flex; align-items: center; gap: 12px; font-size: 16px; letter-spacing: 0.14em; color: #E8C8E8">
        <span style="width: 16px; height: 16px; background: #C000C0"></span>
        <span>λ NÃO ESPECTRAL · 1.284 FOTOS · 61 VÍDEOS · 36 ÁLBUNS</span>
      </div>
      <h1 style="margin: 0; font-size: 64px; font-weight: 800; font-stretch: 125%; line-height: 1">Fotos</h1>
    </div>
    <div style="display: flex; gap: 12px; align-items: center">
      <sc-for list="{{chips}}" as="ch">
        <span style="font-size: 20px; font-weight: 600; padding: 12px 22px; background: {{ch.bg}}; color: {{ch.fg}}">{{ch.label}}</span>
      </sc-for>
    </div>
  </div>

  <sc-for list="{{grupos}}" as="g">
    <div class="grupo">
      <div class="gcab">
        <span style="font-size: 16px; letter-spacing: 0.12em; color: #F2F2F0">{{g.titulo}} <span style="color: #A3A3A0">· {{g.info}}</span></span>
        <span style="font-size: 15px; color: #A3A3A0">Apresentação ▸ · Selecionar</span>
      </div>
      <sc-for list="{{g.fileiras}}" as="f">
        <div class="fileira" style="height: {{f.h}}">
          <sc-for list="{{f.fotos}}" as="p">
            <div class="foto" style="flex: {{p.ar}} 1 0; background: {{p.bg}}; outline: {{p.outline}}; z-index: {{p.z}}">
              <span class="rot">{{p.rot}}</span>
              <span class="vid" style="display: {{p.vid}}">▶ {{p.dur}}</span>
              <span class="fav" style="display: {{p.fav}}">★</span>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var navItems = [['Início', '#F2F2F0'], ['Filmes', '#C0C000'], ['Séries', '#00C0C0'], ['Música', '#00C000'], ['Fotos', '#C000C0'], ['TV ao vivo', '#C00000'], ['Livros', '#0000C0']];
    var nav = navItems.map(function (n, i) {
      var on = i === 4;
      return { label: n[0], fg: on ? '#F2F2F0' : '#A3A3A0', bar: n[1], h: on ? '6px' : '2px' };
    });
    var chips = ['Linha do tempo', 'Álbuns', 'Pastas', 'Favoritos', 'Vídeos'].map(function (l, i) {
      return { label: l, bg: i === 0 ? '#F2F2F0' : '#17181A', fg: i === 0 ? '#0B0B0C' : '#F2F2F0' };
    });
    /* Não há fotos pessoais no projeto: cada foto é um marcador em tom neutro escuro. */
    var tons = [['#2A2E33', '#1C1F22'], ['#302B25', '#201D1A'], ['#26302C', '#1A201E'], ['#33292A', '#221C1D'], ['#282832', '#1B1B22'], ['#2C3027', '#1E211B'], ['#2D2C29', '#1F1E1C'], ['#252B33', '#191D23']];
    var LARG = 1728, GAP = 12, n = 0;
    function fileira(itens, focoIdx) {
      var soma = itens.reduce(function (s, it) { return s + it[0]; }, 0);
      var h = Math.round((LARG - GAP * (itens.length - 1)) / soma);
      return {
        h: h + 'px',
        fotos: itens.map(function (it, i) {
          var t = tons[(n++ * 3) % tons.length], foco = i === focoIdx;
          return {
            ar: it[0], rot: it[1], vid: it[2] ? 'block' : 'none', dur: it[2] || '', fav: it[3] ? 'flex' : 'none',
            bg: 'linear-gradient(160deg, ' + t[0] + ' 0%, ' + t[1] + ' 75%)',
            outline: foco ? '8px solid #F2F2F0' : '0 solid transparent', z: foco ? '2' : '0'
          };
        })
      };
    }
    var grupos = [
      { titulo: 'OUTUBRO 2026', info: '48 FOTOS · SERRA DA MANTIQUEIRA, MG', fileiras: [
        fileira([[1.5, '[FOTO] 12/10 · 07:14'], [0.75, '[FOTO] 07:20'], [1.33, '[FOTO] 07:41', null, true], [1.78, '[VÍDEO] 08:02', '0:42'], [1, '[FOTO] 09:15'], [1.5, '[FOTO] 10:30']], 2),
        fileira([[1.33, '[FOTO] 13/10 · 06:58'], [1.33, '[FOTO] 07:05'], [0.75, '[FOTO] 11:12', null, true], [1.5, '[FOTO] 16:40'], [1.78, '[FOTO] 18:21']], -1)
      ] },
      { titulo: 'SETEMBRO 2026', info: '112 FOTOS · CASA', fileiras: [
        fileira([[1, '[FOTO] 28/09'], [1.5, '[FOTO] 28/09'], [1.33, '[VÍDEO] 27/09', '1:15'], [0.75, '[FOTO] 21/09'], [1.78, '[FOTO] 14/09', null, true], [1.5, '[FOTO] 07/09']], -1)
      ] }
    ];
    return { nav: nav, chips: chips, grupos: grupos };
  }
}
</script>
</body>
</html>
