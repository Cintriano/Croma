<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Croma — Player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.mono{font-family:'IBM Plex Mono',monospace}
.bt{width:72px;height:72px;display:flex;align-items:center;justify-content:center;border:0;background:#17181A;color:#F2F2F0;padding:0}
.bt.foco{background:#F2F2F0;color:#0B0B0C;outline:4px solid #F2F2F0;outline-offset:4px}
.bt svg{display:block}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0B0C; color: #F2F2F0; font-family: 'Archivo', system-ui, sans-serif">

  <!-- Quadro do filme (marcador) -->
  <div style="position: absolute; inset: 0; background: #0B0B0C url('../midia/filmes/blade-runner-2049-2017-h.jpg') center / cover"></div>
  <!-- Véus para leitura dos controles -->
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 240px; background: linear-gradient(to bottom, rgba(11,11,12,.85), rgba(11,11,12,0))"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 560px; background: linear-gradient(to top, rgba(11,11,12,.96) 30%, rgba(11,11,12,0))"></div>

  <!-- Topo: o que está passando e hora -->
  <div style="position: absolute; left: 96px; right: 96px; top: 54px; display: flex; justify-content: space-between; align-items: flex-start">
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div class="mono" style="display: flex; align-items: center; gap: 12px; font-size: 16px; letter-spacing: 0.14em; color: #E4E4C8">
        <span style="width: 16px; height: 16px; background: #C0C000"></span>
        <span>FILME · 2017</span>
      </div>
      <span style="font-size: 48px; font-weight: 800; font-stretch: 125%; line-height: 1">Blade Runner 2049</span>
    </div>
    <div class="mono" style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px">
      <span style="font-size: 32px; color: #F2F2F0">21:47</span>
      <span style="font-size: 16px; color: #A3A3A0">termina às 23:15</span>
    </div>
  </div>

  <!-- Miniatura da busca, sobre a cabeça de leitura -->
  <sc-if value="{{buscando}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: {{thumbLeft}}; top: 600px; width: 368px; display: flex; flex-direction: column; gap: 12px; align-items: center">
      <div style="width: 368px; height: 207px; box-sizing: border-box; border: 8px solid #F2F2F0; background: #17181A url('../midia/filmes/blade-runner-2049-2017-h.jpg') 78% 40% / 240%; display: flex; flex-direction: column">
        <div style="flex-grow: 1"></div>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); height: 6px">
          <div style="background: #C0C0C0"></div><div style="background: #C0C000"></div><div style="background: #00C0C0"></div><div style="background: #00C000"></div><div style="background: #C000C0"></div><div style="background: #C00000"></div><div style="background: #0000C0"></div>
        </div>
      </div>
      <span class="mono" style="font-size: 18px; color: #F2F2F0">{{tempoBusca}} · Capítulo 6</span>
    </div>
  </sc-if>

  <!-- Linha do tempo em espectro: a parte assistida acende, os capítulos são linhas de absorção -->
  <div style="position: absolute; left: 96px; right: 96px; top: 878px; display: flex; flex-direction: column; gap: 14px">
    <div style="position: relative; height: {{barH}}">
      <div style="position: absolute; inset: 0; background: linear-gradient(90deg, #5A00B4 0%, #2A2AFF 18%, #00C0C0 36%, #00C000 52%, #C0C000 68%, #E07000 82%, #C00000 100%)"></div>
      <div style="position: absolute; top: 0; bottom: 0; right: 0; left: {{pctLit}}; background: rgba(11,11,12,.78)"></div>
      <sc-for list="{{capitulos}}" as="cp" hint-placeholder-count="9">
        <span style="position: absolute; top: 0; bottom: 0; left: {{cp}}; width: 4px; margin-left: -2px; background: #0B0B0C"></span>
      </sc-for>
      <span style="position: absolute; left: {{pct}}; top: -12px; bottom: -12px; width: 8px; margin-left: -4px; background: #F2F2F0"></span>
    </div>
    <div class="mono" style="display: flex; justify-content: space-between; font-size: 18px; color: #A3A3A0">
      <span style="color: #F2F2F0">{{tempo}}</span>
      <span>Capítulo 5 de 9</span>
      <span>−1:28:00 · 2:43:52</span>
    </div>
  </div>

  <!-- Controles -->
  <div style="position: absolute; left: 96px; right: 96px; bottom: 54px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; gap: 16px; align-items: center">
      <button type="button" class="bt" aria-label="Capítulo anterior">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="5" width="3" height="14"></rect><path d="M20 5v14L9 12z"></path></svg>
      </button>
      <button type="button" class="bt" aria-label="Voltar 10 segundos">
        <span class="mono" style="font-size: 20px; font-weight: 500">−10</span>
      </button>
      <button type="button" class="bt {{focoPlay}}" aria-label="Pausar">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16"></rect><rect x="14" y="4" width="5" height="16"></rect></svg>
      </button>
      <button type="button" class="bt" aria-label="Avançar 30 segundos">
        <span class="mono" style="font-size: 20px; font-weight: 500">+30</span>
      </button>
      <button type="button" class="bt" aria-label="Próximo capítulo">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5v14l11-7z"></path><rect x="17" y="5" width="3" height="14"></rect></svg>
      </button>
    </div>

    <div class="mono" style="display: flex; gap: 10px; font-size: 15px; color: #A3A3A0">
      <span style="padding: 6px 10px; background: #17181A">2160p</span>
      <span style="padding: 6px 10px; background: #17181A">HDR10</span>
      <span style="padding: 6px 10px; background: #17181A">Atmos 5.1</span>
      <span style="padding: 6px 10px; background: #17181A; color: #00C000">Reprodução direta</span>
    </div>

    <div style="display: flex; gap: 16px; align-items: center">
      <button type="button" class="bt" aria-label="Legendas">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><rect x="3" y="5" width="18" height="14"></rect><path d="M7 12h4M13 12h4M7 15.5h7"></path></svg>
      </button>
      <button type="button" class="bt" aria-label="Áudio">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 9v6h4l5 4V5L8 9z"></path><path d="M16.5 9a4 4 0 010 6M19 6.5a7.5 7.5 0 010 11"></path></svg>
      </button>
      <button type="button" class="bt" aria-label="Capítulos">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><rect x="3" y="5" width="7" height="6"></rect><rect x="14" y="5" width="7" height="6"></rect><rect x="3" y="14" width="7" height="6"></rect><rect x="14" y="14" width="7" height="6"></rect></svg>
      </button>
      <button type="button" class="bt" aria-label="Ajustes de imagem">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 7h16M4 12h16M4 17h16"></path><rect x="7" y="5" width="3" height="4" fill="currentColor"></rect><rect x="14" y="10" width="3" height="4" fill="currentColor"></rect><rect x="9" y="15" width="3" height="4" fill="currentColor"></rect></svg>
      </button>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"buscando":{"editor":"boolean","default":false},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var buscando = this.props.buscando ?? false;
    var total = 2 * 3600 + 43 * 60 + 52;           // 2:43:52
    var agora = 1 * 3600 + 15 * 60 + 52;            // 1:15:52
    var busca = 1 * 3600 + 36 * 60 + 11;            // 1:36:11 (para onde a pessoa está arrastando)
    var t = buscando ? busca : agora;
    function fmt(s) { var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h + ':' + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); }
    var f = t / total;
    var largura = 1728;
    var cabeca = 96 + f * largura;
    var esquerda = Math.min(Math.max(cabeca - 184, 96), 1920 - 96 - 368);
    var caps = [0.09, 0.2, 0.31, 0.39, 0.47, 0.6, 0.73, 0.86];
    return {
      buscando: buscando,
      pct: (f * 100).toFixed(2) + '%',
      pctLit: (agora / total * 100).toFixed(2) + '%',
      tempo: fmt(agora),
      tempoBusca: fmt(busca),
      thumbLeft: esquerda.toFixed(0) + 'px',
      barH: buscando ? '22px' : '12px',
      focoPlay: buscando ? '' : 'foco',
      capitulos: caps.map(function (c) { return (c * 100) + '%'; })
    };
  }
}
</script>
</body>
</html>
