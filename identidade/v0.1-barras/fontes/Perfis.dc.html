<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Croma — Perfis</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.mono{font-family:'IBM Plex Mono',monospace}
.perfil{width:240px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.avatar{width:240px;height:240px;box-sizing:border-box;position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.avatar i{display:block}
.placa{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:112px;height:112px;background:#0B0B0C;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:800;font-stretch:125%}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; overflow: hidden; background: #0B0B0C; color: #F2F2F0; font-family: 'Archivo', system-ui, sans-serif; padding: 54px 96px; display: flex; flex-direction: column; justify-content: space-between">

  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; align-items: center; gap: 2px; font-size: 32px; font-weight: 800; font-stretch: 125%">
      <span>CR</span>
      <svg role="img" aria-label="Croma" width="40" height="24" viewBox="0 0 172 102" style="margin: 0 3px"><rect x="6" y="6" width="160" height="90" fill="none" stroke="#F2F2F0" stroke-width="14"/><rect x="12" y="72" width="21.6" height="18" fill="#C0C0C0"/><rect x="33.4" y="72" width="21.6" height="18" fill="#C0C000"/><rect x="54.9" y="72" width="21.6" height="18" fill="#00C0C0"/><rect x="76.3" y="72" width="21.6" height="18" fill="#00C000"/><rect x="97.7" y="72" width="21.6" height="18" fill="#C000C0"/><rect x="119.1" y="72" width="21.6" height="18" fill="#C00000"/><rect x="140.6" y="72" width="19.4" height="18" fill="#0000C0"/></svg>
      <span>MA</span>
    </div>
    <span class="mono" style="font-size: 18px; color: #A3A3A0">21:47</span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 72px">
    <h1 style="margin: 0; font-size: 64px; font-weight: 800; font-stretch: 125%; line-height: 1">Quem está assistindo?</h1>
    <div style="display: flex; gap: 56px; align-items: flex-start">
      <sc-for list="{{perfis}}" as="p" hint-placeholder-count="4">
        <div class="perfil">
          <div class="avatar" style="background: {{p.fundo}}; outline: {{p.outline}}">
            <sc-for list="{{p.barras}}" as="b"><i style="background: {{b}}"></i></sc-for>
            <span class="placa" style="color: {{p.letraCor}}; background: {{p.placa}}">{{p.inicial}}</span>
          </div>
          <span style="font-size: 26px; font-weight: {{p.peso}}; color: {{p.fg}}">{{p.nome}}</span>
          <span class="mono" style="font-size: 15px; color: {{p.infoFg}}">{{p.info}}</span>
        </div>
      </sc-for>
      <div class="perfil">
        <div style="width: 240px; height: 240px; box-sizing: border-box; border: 2px solid #4A4B4F; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#A3A3A0" stroke-width="2" stroke-linecap="square"><path d="M12 4v16M4 12h16"/></svg>
        </div>
        <span style="font-size: 26px; font-weight: 600; color: #A3A3A0">Adicionar perfil</span>
        <span class="mono" style="font-size: 15px; color: #8A8B8E">pede a senha do administrador</span>
      </div>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center">
    <div class="mono" style="display: flex; align-items: center; gap: 14px; font-size: 16px; color: #8A8B8E">
      <span style="width: 10px; height: 10px; background: #00C000"></span>
      <span>Casa · 192.168.0.10:8096 · v12.4</span>
      <span style="color: #A3A3A0; padding: 6px 12px; border: 2px solid #2A2B2E">Trocar de servidor</span>
    </div>
    <div class="mono" style="display: flex; gap: 28px; font-size: 16px; color: #A3A3A0">
      <span>Gerenciar perfis</span>
      <span>◂ ▸ escolher · OK entrar</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    /* Avatar gerado: 7 barras de uma faixa do espectro (a mesma regra das capas de playlist) + inicial numa placa Sinal. */
    function lambda(l) {
      var r = 0, g = 0, b = 0;
      if (l < 440) { r = -(l - 440) / 60; b = 1; }
      else if (l < 490) { g = (l - 440) / 50; b = 1; }
      else if (l < 510) { g = 1; b = -(l - 510) / 20; }
      else if (l < 580) { r = (l - 510) / 70; g = 1; }
      else if (l < 645) { r = 1; g = -(l - 645) / 65; }
      else { r = 1; }
      var f = l < 420 ? 0.3 + 0.7 * (l - 380) / 40 : 1;
      function c(v) { return ('0' + Math.round(191 * v * f).toString(16)).slice(-2); }
      return '#' + c(r) + c(g) + c(b);
    }
    function barras(de, ate) { var o = []; for (var i = 0; i < 7; i++) o.push(lambda(de + (ate - de) * i / 6)); return o; }
    var lista = [
      { nome: 'Danilo', info: 'administrador', barras: barras(470, 540) },
      { nome: 'Família', info: 'sem senha', barras: barras(560, 640) },
      { nome: 'Infantil', info: 'até 12 anos', barras: barras(400, 470) },
      { nome: 'Convidado', info: 'só assistir', barras: [] }
    ];
    var perfis = lista.map(function (p, i) {
      var foco = i === 0, vazio = !p.barras.length;
      return {
        nome: p.nome, info: p.info, inicial: p.nome[0], barras: p.barras,
        fundo: vazio ? '#17181A' : '#0B0B0C', placa: vazio ? 'transparent' : '#0B0B0C', letraCor: vazio ? '#A3A3A0' : '#F2F2F0',
        outline: foco ? '8px solid #F2F2F0' : '0 solid transparent',
        fg: foco ? '#F2F2F0' : '#A3A3A0', peso: foco ? '700' : '600', infoFg: foco ? '#A3A3A0' : '#8A8B8E'
      };
    });
    return { perfis: perfis };
  }
}
</script>
</body>
</html>
