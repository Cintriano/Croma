<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Croma — Visualizador de fotos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.mono{font-family:'IBM Plex Mono',monospace}
.seta{position:absolute;top:50%;width:72px;height:72px;margin-top:-36px;background:rgba(23,24,26,.88);display:flex;align-items:center;justify-content:center}
.bt{font-family:'Archivo',sans-serif;font-size:22px;font-weight:600;padding:14px 26px;background:#17181A;color:#F2F2F0;border:0;display:flex;align-items:center;gap:10px}
.bt.foco{background:#F2F2F0;color:#0B0B0C;font-weight:700;outline:4px solid #F2F2F0;outline-offset:4px}
.mini{height:64px;box-sizing:border-box}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0B0C; color: #F2F2F0; font-family: 'Archivo', system-ui, sans-serif">

  <!-- A foto (marcador: não há fotos pessoais no projeto) -->
  <div style="position: absolute; left: 240px; right: 240px; top: 0; bottom: 0; background: linear-gradient(170deg, #2C3036 0%, #1D2024 60%, #15171A 100%); display: flex; align-items: center; justify-content: center">
    <span class="mono" style="font-size: 18px; letter-spacing: 0.12em; color: #8A8B8E">[FOTO · 4032 × 3024]</span>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 200px; background: linear-gradient(to bottom, rgba(11,11,12,.85), rgba(11,11,12,0))"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 420px; background: linear-gradient(to top, rgba(11,11,12,.96) 50%, rgba(11,11,12,0))"></div>

  <!-- Topo -->
  <div style="position: absolute; left: 96px; right: 96px; top: 54px; display: flex; justify-content: space-between; align-items: center">
    <div class="mono" style="display: flex; align-items: center; gap: 12px; font-size: 16px; letter-spacing: 0.14em; color: #E8C8E8">
      <span style="width: 16px; height: 16px; background: #C000C0"></span>
      <span>FOTOS · 3 DE 48 · SERRA DA MANTIQUEIRA</span>
    </div>
    <span class="mono" style="font-size: 16px; color: #A3A3A0">◂ voltar à galeria</span>
  </div>

  <!-- Setas -->
  <div class="seta" style="left: 96px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F2F2F0" stroke-width="2.4" stroke-linecap="square"><path d="M15 5l-7 7 7 7"/></svg></div>
  <div class="seta" style="right: 96px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F2F2F0" stroke-width="2.4" stroke-linecap="square"><path d="M9 5l7 7-7 7"/></svg></div>

  <!-- Fita de fotos -->
  <div style="position: absolute; left: 96px; right: 96px; top: 812px; display: flex; justify-content: center; gap: 10px; align-items: center">
    <sc-for list="{{fita}}" as="m">
      <div class="mini" style="width: {{m.w}}; background: {{m.bg}}; outline: {{m.outline}}; opacity: {{m.op}}"></div>
    </sc-for>
  </div>

  <!-- Faixa de informações e ações -->
  <div style="position: absolute; left: 96px; right: 96px; bottom: 54px; display: flex; justify-content: space-between; align-items: flex-end; gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
      <span style="font-size: 34px; font-weight: 700; font-stretch: 112%">12 de outubro de 2026 · 07:41</span>
      <span class="mono" style="font-size: 16px; color: #A3A3A0">Serra da Mantiqueira, MG · Câmera do celular · 4032 × 3024 · 3,2 MB · f/1.8 · 1/120 s · ISO 100</span>
    </div>
    <div style="display: flex; gap: 14px; flex-shrink: 0">
      <button type="button" class="bt foco"><svg width="18" height="18" viewBox="0 0 24 24" fill="#0B0B0C"><path d="M6 4v16l14-8z"/></svg>Apresentação</button>
      <button type="button" class="bt"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F2F0" stroke-width="2" stroke-linecap="square"><path d="M20 12a8 8 0 11-3-6.2M20 4v5h-5"/></svg>Girar</button>
      <button type="button" class="bt"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2F2F0" stroke-width="2" stroke-linecap="square"><rect x="4" y="4" width="16" height="16"/><path d="M12 11v6M12 7.5v.5"/></svg>Informações</button>
      <button type="button" class="bt"><span style="width: 18px; height: 18px; background: #C000C0; display: flex; align-items: center; justify-content: center; font-size: 12px">★</span>Favorita</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var tons = [['#2A2E33', '#1C1F22'], ['#302B25', '#201D1A'], ['#26302C', '#1A201E'], ['#33292A', '#221C1D'], ['#282832', '#1B1B22'], ['#2C3027', '#1E211B'], ['#2D2C29', '#1F1E1C'], ['#252B33', '#191D23']];
    var ars = [1.5, 0.75, 1.33, 1.78, 1, 1.5, 1.33, 1.33, 0.75];
    var atual = 2;
    var fita = ars.map(function (ar, i) {
      var t = tons[(i * 3) % tons.length];
      return {
        w: Math.round(64 * ar) + 'px', bg: 'linear-gradient(160deg, ' + t[0] + ', ' + t[1] + ')',
        outline: i === atual ? '4px solid #F2F2F0' : '0 solid transparent', op: i === atual ? '1' : '0.7'
      };
    });
    return { fita: fita };
  }
}
</script>
</body>
</html>
