<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Croma — TV ao vivo: guia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#A3A3A0;text-decoration:none}
.mono{font-family:'IBM Plex Mono',monospace}
.linha{height:84px;display:flex;gap:6px}
.canal{width:274px;flex-shrink:0;background:#111214;display:flex;align-items:center;gap:16px;padding:0 18px;box-sizing:border-box}
.trilho{position:relative;width:1448px;flex-shrink:0}
.prog{position:absolute;top:0;bottom:0;box-sizing:border-box;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.prog b{font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog span{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#A3A3A0;white-space:nowrap}
.bt{font-family:'Archivo',sans-serif;font-size:22px;font-weight:600;padding:14px 28px;background:#17181A;color:#F2F2F0;border:0;display:flex;align-items:center;gap:10px}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; overflow: hidden; background: #0B0B0C; color: #F2F2F0; font-family: 'Archivo', system-ui, sans-serif; padding: 44px 96px 0; display: flex; flex-direction: column; gap: 32px">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 64px; flex-shrink: 0">
    <div style="display: flex; align-items: center; gap: 72px">
      <div style="display: flex; align-items: center; gap: 2px; font-size: 32px; font-weight: 800; font-stretch: 125%">
        <span>CR</span>
        <svg role="img" aria-label="Croma" width="40" height="24" viewBox="0 0 172 102" style="margin: 0 3px"><rect x="6" y="6" width="160" height="90" fill="none" stroke="#F2F2F0" stroke-width="14"/><rect x="12" y="72" width="21.6" height="18" fill="#C0C0C0"/><rect x="33.4" y="72" width="21.6" height="18" fill="#C0C000"/><rect x="54.9" y="72" width="21.6" height="18" fill="#00C0C0"/><rect x="76.3" y="72" width="21.6" height="18" fill="#00C000"/><rect x="97.7" y="72" width="21.6" height="18" fill="#C000C0"/><rect x="119.1" y="72" width="21.6" height="18" fill="#C00000"/><rect x="140.6" y="72" width="19.4" height="18" fill="#0000C0"/></svg>
        <span>MA</span>
      </div>
      <nav aria-label="Seções" style="display: flex; gap: 36px">
        <sc-for list="{{nav}}" as="item" hint-placeholder-count="7">
          <a href="#" style="display: flex; flex-direction: column; gap: 8px; font-size: 22px; font-weight: 600; color: {{item.fg}}">
            <span>{{item.label}}</span>
            <span style="height: {{item.h}}; background: {{item.bar}}"></span>
          </a>
        </sc-for>
      </nav>
    </div>
    <div style="display: flex; align-items: center; gap: 20px">
      <span class="mono" style="font-size: 28px; color: #F2F2F0">21:47</span>
      <button type="button" aria-label="Perfil" style="width: 56px; height: 56px; background: #2A2B2E; border: 0; color: #F2F2F0; font-family: 'Archivo', sans-serif; font-size: 22px; font-weight: 700">D</button>
    </div>
  </div>

  <!-- Programa em foco -->
  <div style="display: flex; gap: 48px; height: 270px; flex-shrink: 0">
    <div style="width: 480px; height: 270px; flex-shrink: 0; box-sizing: border-box; border: 8px solid #F2F2F0; background: #17181A url('../midia/filmes/duna-2021-h.jpg') center / cover; display: flex; flex-direction: column; justify-content: flex-end">
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); height: 8px"><i style="background:#C0C0C0"></i><i style="background:#C0C000"></i><i style="background:#00C0C0"></i><i style="background:#00C000"></i><i style="background:#C000C0"></i><i style="background:#C00000"></i><i style="background:#0000C0"></i></div>
    </div>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; justify-content: center">
      <div class="mono" style="display: flex; align-items: center; gap: 12px; font-size: 16px; letter-spacing: 0.14em; color: #E8C8C8">
        <span style="width: 16px; height: 16px; background: #C00000"></span>
        <span>TV AO VIVO · λ 650 nm · 7.1 CINE CROMA</span>
      </div>
      <span style="font-size: 56px; font-weight: 800; font-stretch: 125%; line-height: 1">Duna</span>
      <span class="mono" style="font-size: 18px; color: #A3A3A0">22:00 – 00:35 · começa em 13 min · Filme · 14 anos · HD · 5.1</span>
      <div style="display: flex; gap: 14px; padding-top: 6px">
        <button type="button" class="bt">Lembrar às 22:00</button>
        <button type="button" class="bt"><span style="width: 14px; height: 14px; background: #C00000; display: block"></span>Gravar</button>
        <button type="button" class="bt">Ver canal agora</button>
      </div>
    </div>
  </div>

  <!-- Grade -->
  <div style="display: flex; flex-direction: column; gap: 6px; position: relative; flex-shrink: 0">
    <!-- Régua de horários -->
    <div style="height: 36px; display: flex; gap: 6px">
      <div class="mono" style="width: 274px; flex-shrink: 0; display: flex; align-items: center; font-size: 14px; letter-spacing: 0.1em; color: #A3A3A0">HOJE · QUI 05/11</div>
      <div class="trilho">
        <sc-for list="{{horas}}" as="h">
          <span class="mono" style="position: absolute; left: {{h.x}}; top: 8px; font-size: 16px; color: #A3A3A0; padding-left: 8px; border-left: 2px solid #2A2B2E">{{h.t}}</span>
        </sc-for>
        <span class="mono" style="position: absolute; left: {{agoraX}}; top: 2px; transform: translateX(-50%); padding: 4px 8px; background: #C00000; color: #F2F2F0; font-size: 15px; font-weight: 500; z-index: 3">21:47</span>
      </div>
    </div>

    <sc-for list="{{canais}}" as="c">
      <div class="linha">
        <div class="canal" style="background: {{c.bgCanal}}">
          <span class="mono" style="font-size: 22px; font-weight: 500; color: {{c.fgNum}}">{{c.num}}</span>
          <span style="font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.nome}}</span>
        </div>
        <div class="trilho">
          <sc-for list="{{c.progs}}" as="p">
            <div class="prog" style="left: {{p.x}}; width: {{p.w}}; background: {{p.bg}}; outline: {{p.outline}}; z-index: {{p.z}}">
              <b style="color: {{p.fg}}">{{p.t}}</b>
              <span>{{p.h}}</span>
              <i style="position: absolute; left: 0; bottom: 0; height: 4px; width: {{p.pct}}; background: #C00000; display: block"></i>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <!-- Passado escurecido e linha do agora -->
    <div style="position: absolute; left: 280px; top: 42px; bottom: 0; width: {{agoraX}}; background: rgba(11,11,12,.45); pointer-events: none; z-index: 1"></div>
    <div style="position: absolute; left: {{agoraAbs}}; top: 36px; bottom: 0; width: 3px; margin-left: -1.5px; background: #C00000; z-index: 2"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var navItems = [['Início', '#F2F2F0'], ['Filmes', '#C0C000'], ['Séries', '#00C0C0'], ['Música', '#00C000'], ['Fotos', '#C000C0'], ['TV ao vivo', '#C00000'], ['Livros', '#0000C0']];
    var nav = navItems.map(function (n, i) {
      var on = i === 5;
      return { label: n[0], fg: on ? '#F2F2F0' : '#A3A3A0', bar: n[1], h: on ? '6px' : '2px' };
    });
    /* Janela de 21:30 a 00:00 (150 min) em 1448 px. */
    var JAN = 150, LARG = 1448, k = LARG / JAN, AGORA = 17;
    function hm(m) { var t = 21 * 60 + 30 + m; t = (t + 1440) % 1440; return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }
    var horas = [0, 30, 60, 90, 120].map(function (m) { return { x: (m * k).toFixed(0) + 'px', t: hm(m) }; });
    var foco = ['7.1', 1];
    var dados = [
      ['2.1', 'Cultura Local', [['Concerto da Orquestra Jovem', -30, 45], ['Ateliê', 45, 90], ['Sessão das 23h: cinema nacional', 90, 200]]],
      ['4.1', 'Notícias 24h', [['Jornal da Noite', -15, 30], ['Mercados', 30, 60], ['Entrevista', 60, 90], ['Jornal da Madrugada', 90, 180]]],
      ['5.1', 'Esporte Mais', [['Futebol · Série B · ao vivo', -60, 60], ['Resenha', 60, 120], ['Gols da Rodada', 120, 180]]],
      ['7.1', 'Cine Croma', [['Matrix', -105, 30], ['Duna', 30, 185]]],
      ['9.1', 'Infantil', [['Desenhos', -30, 30], ['Hora de dormir', 30, 60], ['FORA', 60, 300]]],
      ['11.1', 'Documentários', [['Planeta Oceano', -40, 20], ['Arquitetos do Deserto', 20, 80], ['Cosmos em 4K', 80, 170]]]
    ];
    var canais = dados.map(function (d) {
      var linhaFoco = d[0] === foco[0];
      return {
        num: d[0], nome: d[1], bgCanal: linhaFoco ? '#1B1C1F' : '#111214', fgNum: linhaFoco ? '#F2F2F0' : '#A3A3A0',
        progs: d[2].map(function (p, i) {
          var a = Math.max(p[1], 0), b = Math.min(p[2], JAN);
          var atual = p[1] <= AGORA && p[2] > AGORA;
          var fora = p[0] === 'FORA';
          var emFoco = linhaFoco && i === foco[1];
          var bg = fora ? 'repeating-linear-gradient(0deg, #141516 0 2px, #1C1D20 2px 4px)' : (atual ? '#202226' : '#17181A');
          return {
            x: (a * k + 3).toFixed(0) + 'px', w: ((b - a) * k - 6).toFixed(0) + 'px', bg: bg,
            t: fora ? 'Fora do ar' : (p[1] < 0 ? '‹ ' : '') + p[0], fg: fora ? '#8A8B8E' : '#F2F2F0',
            h: fora ? 'SEM SINAL ATÉ 06:00' : hm(p[1]) + ' – ' + hm(p[2]),
            pct: atual ? (((AGORA - p[1]) / (p[2] - p[1])) * 100).toFixed(0) + '%' : '0',
            outline: emFoco ? '8px solid #F2F2F0' : '0 solid transparent', z: emFoco ? '4' : '0'
          };
        })
      };
    });
    return { nav: nav, horas: horas, canais: canais, agoraX: (AGORA * k).toFixed(0) + 'px', agoraAbs: (280 + AGORA * k).toFixed(0) + 'px' };
  }
}
</script>
</body>
</html>
