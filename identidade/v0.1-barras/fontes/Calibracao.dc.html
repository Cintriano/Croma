<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Croma — Tela de calibração</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#F2F2F0}a:hover{color:#BFBFBF}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #131313; font-family: 'Archivo', system-ui, sans-serif; color: #F2F2F0">

  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); height: 720px">
    <div style="background: #C0C0C0"></div>
    <div style="background: #C0C000"></div>
    <div style="background: #00C0C0"></div>
    <div style="background: #00C000"></div>
    <div style="background: #C000C0"></div>
    <div style="background: #C00000"></div>
    <div style="background: #0000C0"></div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); height: 90px">
    <div style="background: #0000C0"></div>
    <div style="background: #131313"></div>
    <div style="background: #C000C0"></div>
    <div style="background: #131313"></div>
    <div style="background: #00C0C0"></div>
    <div style="background: #131313"></div>
    <div style="background: #C0C0C0"></div>
  </div>
  <div style="display: grid; grid-template-columns: 15fr 15fr 15fr 15fr 4fr 4fr 4fr 12fr; height: 270px">
    <div style="background: #00214C"></div>
    <div style="background: #FFFFFF"></div>
    <div style="background: #32006A"></div>
    <div style="background: #131313"></div>
    <div style="background: #090909"></div>
    <div style="background: #131313"></div>
    <div style="background: #1D1D1D"></div>
    <div style="background: #131313"></div>
  </div>

  <div style="position: absolute; left: 1666px; top: 836px; width: 230px; display: flex; flex-direction: column; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 15px; line-height: 1.4; color: #A3A3A0">
    <span style="color: #F2F2F0; letter-spacing: 0.1em">◂ PLUGE</span>
    <span>A faixa da esquerda deve sumir. A da direita, não.</span>
  </div>

  <sc-if value="{{showPanel}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 530px; top: 140px; width: 860px; box-sizing: border-box; background: #0B0B0C; border: 12px solid #F2F2F0; padding: 44px 52px; display: flex; flex-direction: column; gap: 26px">

      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="display: flex; align-items: center; gap: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 15px; letter-spacing: 0.14em; color: #A3A3A0">
          <svg aria-hidden="true" width="44" height="26" viewBox="0 0 172 102">
            <rect x="6" y="6" width="160" height="90" fill="none" stroke="#F2F2F0" stroke-width="14"></rect>
            <rect x="12" y="72" width="21.6" height="18" fill="#C0C0C0"></rect>
            <rect x="33.4" y="72" width="21.6" height="18" fill="#C0C000"></rect>
            <rect x="54.9" y="72" width="21.6" height="18" fill="#00C0C0"></rect>
            <rect x="76.3" y="72" width="21.6" height="18" fill="#00C000"></rect>
            <rect x="97.7" y="72" width="21.6" height="18" fill="#C000C0"></rect>
            <rect x="119.1" y="72" width="21.6" height="18" fill="#C00000"></rect>
            <rect x="140.6" y="72" width="19.4" height="18" fill="#0000C0"></rect>
          </svg>
          <span>AJUSTE DE IMAGEM</span>
        </div>
        <div style="display: flex; gap: 10px">
          <sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; padding: 6px 12px; color: {{st.fg}}; background: {{st.bg}}">{{st.label}}</span>
          </sc-for>
        </div>
      </div>

      <h1 style="margin: 0; font-size: 64px; font-weight: 800; font-stretch: 125%; line-height: 1">{{title}}</h1>
      <p style="margin: 0; font-size: 26px; line-height: 1.45; color: #E4E4E1">{{body}}</p>

      <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 8px">
        <div style="display: flex; gap: 16px">
          <button type="button" style="font-family: 'Archivo', sans-serif; font-size: 24px; font-weight: 700; padding: 16px 36px; background: #F2F2F0; color: #0B0B0C; border: 0; outline: 4px solid #F2F2F0; outline-offset: 4px; cursor: pointer">Próximo</button>
          <button type="button" style="font-family: 'Archivo', sans-serif; font-size: 24px; font-weight: 600; padding: 16px 36px; background: transparent; color: #F2F2F0; border: 2px solid #4A4B4F; cursor: pointer">Pular</button>
        </div>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #A3A3A0">◂ ▸ navegar · OK confirmar</span>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showPanel":{"editor":"boolean","default":true},"step":{"editor":"enum","options":["Brilho","Contraste","Cor"],"default":"Brilho"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var step = this.props.step ?? 'Brilho';
    var copy = {
      Brilho: 'Diminua o brilho da TV até a faixa mais escura, no canto inferior direito, desaparecer. A faixa do lado dela deve continuar visível.',
      Contraste: 'Aumente o contraste até o quadrado branco ficar o mais claro possível, sem borrar o limite com os blocos ao lado.',
      Cor: 'Ative o modo só-azul da TV. Ajuste a cor até as barras azuis de cima e de baixo terem o mesmo brilho.'
    };
    var names = ['Brilho', 'Contraste', 'Cor'];
    var steps = names.map(function (n, i) {
      var active = n === step;
      return { label: (i + 1) + ' ' + n, fg: active ? '#0B0B0C' : '#A3A3A0', bg: active ? '#F2F2F0' : '#17181A' };
    });
    return {
      showPanel: this.props.showPanel ?? true,
      title: step,
      body: copy[step],
      steps: steps
    };
  }
}
</script>
</body>
</html>
