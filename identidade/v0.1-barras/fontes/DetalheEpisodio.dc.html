<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Croma — Detalhe do episódio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.mono{font-family:'IBM Plex Mono',monospace}
.bt{height:64px;padding:0 28px;box-sizing:border-box;display:flex;align-items:center;gap:12px;background:#17181A;color:#F2F2F0;font-family:'Archivo',sans-serif;font-size:22px;font-weight:600;border:0}
.bt.foco{background:#F2F2F0;color:#0B0B0C;font-weight:700;outline:4px solid #F2F2F0;outline-offset:4px}
.ep{display:flex;gap:18px;align-items:center;padding:8px;margin:0 -8px}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0B0C; color: #F2F2F0; font-family: 'Archivo', system-ui, sans-serif">

  <!-- Nav reduzida -->
  <div style="position: absolute; left: 96px; right: 96px; top: 44px; height: 64px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 28px">
      <span class="mono" style="font-size: 18px; color: #A3A3A0">◂ Dark</span>
      <span style="display: flex; flex-direction: column; gap: 8px; font-size: 22px; font-weight: 600">Séries<span style="height: 6px; background: #00C0C0"></span></span>
    </div>
    <span class="mono" style="font-size: 24px">21:47</span>
  </div>

  <!-- Coluna do episódio -->
  <div style="position: absolute; left: 96px; top: 148px; width: 760px; display: flex; flex-direction: column; gap: 20px">
    <div style="width: 760px; height: 428px; box-sizing: border-box; border: 12px solid #F2F2F0; background: #17181A url('../midia/series/dark-2017-h.jpg') center / cover; display: flex; flex-direction: column; justify-content: flex-end">
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); height: 10px"><i style="background:#C0C0C0"></i><i style="background:#C0C000"></i><i style="background:#00C0C0"></i><i style="background:#00C000"></i><i style="background:#C000C0"></i><i style="background:#C00000"></i><i style="background:#0000C0"></i></div>
    </div>
    <div class="mono" style="display: flex; align-items: center; gap: 12px; font-size: 16px; letter-spacing: 0.14em; color: #C8E4E4">
      <span style="width: 16px; height: 16px; background: #00C0C0"></span>
      <span>DARK · TEMPORADA 2 · EPISÓDIO 6</span>
    </div>
    <h1 style="margin: 0; font-size: 64px; font-weight: 800; font-stretch: 125%; line-height: 1">Episódio 6</h1>
    <div class="mono" style="display: flex; gap: 10px; align-items: center; font-size: 18px; color: #A3A3A0">
      <span>2019 · 48 min</span>
      <span style="padding: 2px 8px; background: #F2F2F0; color: #0B0B0C; font-weight: 500">16</span>
      <span>· 2160p · 5.1 · alemão</span>
    </div>
    <span class="mono" style="font-size: 16px; color: #8A8B8E">[SINOPSE DO EPISÓDIO — vem dos metadados do servidor]</span>
    <div style="display: flex; flex-direction: column; gap: 8px; width: 520px"><div style="height: 6px; background: #2A2B2E; display: flex"><div style="width: 60%; background: #00C0C0"></div></div><span class="mono" style="font-size: 14px; color: #A3A3A0">parou em 29:12 · faltam 19 min</span></div>
    <div style="display: flex; gap: 14px; padding-top: 4px">
      <button type="button" class="bt foco"><svg width="18" height="18" viewBox="0 0 24 24" fill="#0B0B0C"><path d="M6 4v16l14-8z"/></svg>Continuar</button>
      <button type="button" class="bt">Do início</button>
      <button type="button" class="bt">Marcar como visto</button>
    </div>
  </div>

  <!-- Coluna da temporada -->
  <div style="position: absolute; left: 920px; right: 96px; top: 148px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; gap: 20px; align-items: flex-end">
      <div style="width: 72px; height: 108px; flex-shrink: 0; background: #17181A url('../midia/series/dark-2017-t02.jpg') center / cover"></div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <span style="font-size: 30px; font-weight: 800; font-stretch: 125%">Temporada 2</span>
          <div style="display: flex; gap: 8px">
            <span style="font-size: 18px; font-weight: 600; padding: 8px 16px; background: #17181A">T1</span>
            <span style="font-size: 18px; font-weight: 600; padding: 8px 16px; background: #F2F2F0; color: #0B0B0C">T2</span>
            <span style="font-size: 18px; font-weight: 600; padding: 8px 16px; background: #17181A">T3</span>
          </div>
        </div>
        <!-- Fita da temporada -->
        <div style="display: flex; gap: 6px; height: 16px">
          <sc-for list="{{eps}}" as="e"><span style="flex: 1 1 0; box-sizing: border-box; background: {{e.fita}}; border: {{e.fitaBorda}}"></span></sc-for>
        </div>
        <span class="mono" style="font-size: 14px; color: #A3A3A0">5 de 8 vistos · 2019 · 8 episódios</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #2A2B2E; padding-top: 10px">
      <sc-for list="{{eps}}" as="e" hint-placeholder-count="8">
        <div class="ep" style="background: {{e.bg}}">
          <div style="width: 112px; height: 63px; flex-shrink: 0; position: relative; background: #17181A url('../midia/series/dark-2017-h.jpg') {{e.pos}} / 260%; box-shadow: inset 0 0 0 200px rgba(11,11,12,{{e.dim}}); display: flex; flex-direction: column; justify-content: flex-end">
            <span style="display: {{e.visto}}; position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; background: #00C0C0; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#0B0B0C" stroke-width="3" stroke-linecap="square"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span>
            <div style="height: 4px; background: rgba(11,11,12,.6); display: flex"><div style="width: {{e.pct}}; background: #00C0C0"></div></div>
          </div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 21px; font-weight: {{e.peso}}; color: {{e.fg}}">{{e.t}}</span>
            <span class="mono" style="font-size: 14px; color: #A3A3A0">{{e.meta}}</span>
          </div>
          <span class="mono" style="font-size: 14px; color: {{e.estadoFg}}; padding-right: 8px">{{e.estado}}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var dur = ['53 min', '47 min', '50 min', '52 min', '49 min', '48 min', '55 min', '51 min'];
    var pos = ['10% 20%', '30% 70%', '55% 35%', '20% 30%', '50% 60%', '80% 40%', '35% 80%', '65% 20%'];
    var eps = dur.map(function (d, i) {
      var visto = i < 5, atual = i === 5;
      return {
        t: 'Episódio ' + (i + 1), meta: d, pos: pos[i],
        pct: visto ? '100%' : atual ? '60%' : '0%',
        visto: visto ? 'flex' : 'none', dim: visto ? '0.45' : '0',
        bg: atual ? '#17181A' : 'transparent', fg: visto ? '#A3A3A0' : '#F2F2F0', peso: atual ? '700' : '500',
        estado: visto ? 'visto' : atual ? 'faltam 19 min' : '', estadoFg: atual ? '#00C0C0' : '#8A8B8E',
        fita: visto ? '#00C0C0' : atual ? 'linear-gradient(90deg,#00C0C0 0 60%,#2A2B2E 60% 100%)' : '#2A2B2E',
        fitaBorda: atual ? '2px solid #F2F2F0' : '0 solid transparent'
      };
    });
    return { eps: eps };
  }
}
</script>
</body>
</html>
