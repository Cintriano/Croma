<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Croma — Player: legendas e áudio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.mono{font-family:'IBM Plex Mono',monospace}
.sec{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:0.12em;color:#A3A3A0}
.item{display:flex;align-items:center;gap:14px;height:52px;padding:0 16px;font-size:21px;box-sizing:border-box}
.marca{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.seg{display:flex;gap:6px}
.seg span{font-size:18px;font-weight:600;padding:9px 14px;background:#17181A}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0B0B0C; color: #F2F2F0; font-family: 'Archivo', system-ui, sans-serif">

  <!-- Vídeo, escurecido enquanto o painel está aberto -->
  <div style="position: absolute; inset: 0; background: #0B0B0C url('../midia/filmes/blade-runner-2049-2017-h.jpg') center / cover"></div>
  <div style="position: absolute; inset: 0; background: rgba(11,11,12,.35)"></div>

  <!-- Legenda de exemplo, no estilo escolhido (Caixa · M) -->
  <div style="position: absolute; left: 96px; width: 1084px; bottom: 120px; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <span style="font-size: 44px; font-weight: 600; line-height: 1.25; padding: 4px 16px; background: rgba(11,11,12,.78)">Assim fica a legenda no tamanho M,</span>
    <span style="font-size: 44px; font-weight: 600; line-height: 1.25; padding: 4px 16px; background: rgba(11,11,12,.78)">com fundo em caixa.</span>
  </div>

  <!-- Título discreto -->
  <div style="position: absolute; left: 96px; top: 54px; display: flex; flex-direction: column; gap: 10px">
    <div class="mono" style="display: flex; align-items: center; gap: 12px; font-size: 16px; letter-spacing: 0.14em; color: #E4E4C8"><span style="width: 16px; height: 16px; background: #C0C000"></span>FILME · 2017 · PAUSADO</div>
    <span style="font-size: 40px; font-weight: 800; font-stretch: 125%">Blade Runner 2049</span>
  </div>

  <!-- Painel lateral -->
  <aside style="position: absolute; top: 0; right: 0; bottom: 0; width: 760px; box-sizing: border-box; background: #0B0B0C; border-left: 12px solid #F2F2F0; padding: 54px 96px 54px 56px; display: flex; flex-direction: column; gap: 26px">

    <div style="display: flex; gap: 36px">
      <span style="display: flex; flex-direction: column; gap: 10px; font-size: 26px; font-weight: 700">Legendas e áudio<span style="height: 6px; background: #C0C000"></span></span>
      <span style="display: flex; flex-direction: column; gap: 10px; font-size: 26px; font-weight: 600; color: #8A8B8E">Imagem<span style="height: 2px; background: transparent"></span></span>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 28px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span class="sec">LEGENDAS</span>
        <sc-for list="{{legendas}}" as="l">
          <div class="item" style="background: {{l.bg}}; color: {{l.fg}}; outline: {{l.outline}}; outline-offset: 4px">
            <span class="marca" style="background: {{l.mbg}}"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="{{l.mfg}}" stroke-width="2.8" stroke-linecap="square" style="display: {{l.check}}"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span>
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-weight: {{l.peso}}; white-space: nowrap">{{l.t}}</span>
            </span>
            <span class="mono" style="margin-left: auto; font-size: 13px; color: {{l.sfg}}">{{l.s}}</span>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span class="sec">ÁUDIO</span>
        <sc-for list="{{audios}}" as="l">
          <div class="item" style="background: {{l.bg}}; color: {{l.fg}}; outline: {{l.outline}}; outline-offset: 4px">
            <span class="marca" style="background: {{l.mbg}}"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="{{l.mfg}}" stroke-width="2.8" stroke-linecap="square" style="display: {{l.check}}"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span>
            <span style="font-weight: {{l.peso}}; white-space: nowrap">{{l.t}}</span>
            <span class="mono" style="margin-left: auto; font-size: 13px; color: {{l.sfg}}">{{l.s}}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="height: 1px; background: #2A2B2E"></div>

    <div style="display: flex; flex-direction: column; gap: 18px">
      <span class="sec">ESTILO DA LEGENDA</span>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 20px; color: #E4E4E1">Tamanho</span>
        <div class="seg"><span>P</span><span style="background: #F2F2F0; color: #0B0B0C">M</span><span>G</span><span>GG</span></div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 20px; color: #E4E4E1">Fundo</span>
        <div class="seg"><span>Nenhum</span><span>Contorno</span><span style="background: #F2F2F0; color: #0B0B0C">Caixa</span></div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 20px; color: #E4E4E1">Atraso</span>
        <div style="display: flex; align-items: center; gap: 6px">
          <span style="width: 44px; height: 44px; background: #17181A; display: flex; align-items: center; justify-content: center; font-size: 24px">−</span>
          <span class="mono" style="width: 110px; height: 44px; background: #17181A; display: flex; align-items: center; justify-content: center; font-size: 20px">+0,0 s</span>
          <span style="width: 44px; height: 44px; background: #17181A; display: flex; align-items: center; justify-content: center; font-size: 24px">+</span>
        </div>
      </div>
    </div>

    <span class="mono" style="margin-top: auto; font-size: 14px; color: #8A8B8E">◂ ▸ trocar coluna · OK escolher · Voltar fecha o painel</span>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    /* estado: m = marcado, f = em foco, '' = normal */
    function linha(t, s, estado) {
      var foco = estado === 'f', marcado = estado === 'm';
      return {
        t: t, s: s,
        bg: foco ? '#F2F2F0' : (marcado ? '#17181A' : 'transparent'),
        fg: foco ? '#0B0B0C' : (marcado ? '#F2F2F0' : '#E4E4E1'),
        sfg: foco ? '#2A2B2E' : '#8A8B8E',
        outline: foco ? '4px solid #F2F2F0' : '0 solid transparent',
        peso: marcado || foco ? '700' : '400',
        mbg: marcado ? '#C0C000' : 'transparent',
        mfg: '#0B0B0C',
        check: marcado ? 'block' : 'none'
      };
    }
    var legendas = [
      linha('Desligadas', '', ''),
      linha('Português', 'BR', 'm'),
      linha('Português', 'forçadas', ''),
      linha('Inglês', 'SDH', 'f'),
      linha('Inglês', '', ''),
      linha('Espanhol', '', '')
    ];
    var audios = [
      linha('Inglês', 'Atmos 7.1', 'm'),
      linha('Português', '5.1', ''),
      linha('Inglês', 'comentários', ''),
      linha('Espanhol', '5.1', '')
    ];
    return { legendas: legendas, audios: audios };
  }
}
</script>
</body>
</html>
